name: Auto Scrape VSC Highlights

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies (Stealth & Puppeteer)
        run: npm install puppeteer puppeteer-extra puppeteer-extra-plugin-stealth

      - name: Run scraper script
        run: node scraper.js

      - name: Commit and push if playlist changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add playlist.m3u
          git commit -m "Auto-update playlist .m3u with Stealth" || exit 0
          git push
