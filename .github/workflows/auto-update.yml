name: Auto Scrape Highlights API

on:
  schedule:
    - cron: '0 */3 * * *' # Tự động cập nhật mỗi 3 tiếng
  workflow_dispatch: # Cho phép bấm nút chạy thủ công

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run scraper script
        run: node scraper.js

      - name: Commit and push if playlist changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add playlist.m3u
          git commit -m "Auto-update playlist .m3u via ScoreBat API" || exit 0
          git push
